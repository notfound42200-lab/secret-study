<!DOCTYPE html>
<html>
<head>
    <title>Secreat Study</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .page {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .box {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            background: #111;
            color: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 22px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .price {
            font-size: 36px;
            font-weight: bold;
            margin: 25px 0;
        }

        .secure {
            font-size: 14px;
            color: #777;
            margin-bottom: 18px;
        }

        .pay-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .pay-btn:hover {
            background: #333;
        }

        .back {
            display: block;
            margin-top: 22px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #111;
        }

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            .box {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        My File Store
    </div>

    <a href="/">
        Home
    </a>

</header>


<div class="page">

    <div class="box">

        <div class="icon">
            📄
        </div>

        <h1>
            Secreat Study Material
        </h1>

        <p class="description">
            Complete all video. Get instant access after successful payment.
        </p>

        <div class="price">
            ₹99
        </div>

        <div class="secure">
            🔒 Secure payment powered by Razorpay
        </div>

        <button class="pay-btn" onclick="payNow()">
            Pay ₹99
        </button>

        <a href="/" class="back">
            ← Back to store
        </a>

    </div>

</div>


<script>
function payNow() {

    var options = {
        "key": "{{ key_id }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "My File Store",
        "description": "C Programming Notes",
        "order_id": "{{ order_id }}",

        "handler": function (response) {

            var form = document.createElement("form");

            form.method = "POST";
            form.action = "/payment/verify";

            var paymentId = document.createElement("input");
            paymentId.type = "hidden";
            paymentId.name = "razorpay_payment_id";
            paymentId.value = response.razorpay_payment_id;

            var orderId = document.createElement("input");
            orderId.type = "hidden";
            orderId.name = "razorpay_order_id";
            orderId.value = response.razorpay_order_id;

            var signature = document.createElement("input");
            signature.type = "hidden";
            signature.name = "razorpay_signature";
            signature.value = response.razorpay_signature;

            form.appendChild(paymentId);
            form.appendChild(orderId);
            form.appendChild(signature);

            document.body.appendChild(form);

            form.submit();
        },

        "theme": {
            "color": "#111111"
        }
    };

    var rzp = new Razorpay(options);

    rzp.open();
}
</script>

</body>
</html>
